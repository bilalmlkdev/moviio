<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!--  SEO -->
  <title>Moviio - Discover movies in motion. Browse films, watch trailers, and explore cinema with Moviio.</title>
  <meta name="description"
    content="Moviio is a modern movie discovery platform to explore popular, top-rated, and upcoming films, watch official trailers, and browse cinema in a smooth motion-driven experience." />
  <meta name="keywords"
    content="movies, movie discovery, film explorer, cinema, movie trailers, tmdb, film search, moviio" />
  <meta name="author" content="Moviio" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Moviio - Explore Movies in Motion" />
  <meta property="og:description"
    content="Discover movies in motion. Browse films, watch trailers, and explore cinema with Moviio." />
  <meta property="og:url" content="https://moviio.vercel.app" />
  <meta property="og:image" content="https://moviio.vercel.app/og-image.jpg" />
  <meta property="og:site_name" content="Moviio" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Moviio — Explore Movies in Motion" />
  <meta name="twitter:description"
    content="A cinematic movie explorer with smooth motion, trailers, and TMDB-powered discovery." />
  <meta name="twitter:image" content="https://moviio.vercel.app/og-image.jpg" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="./assets/favicon.svg" />
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* this is for layout safety of cards*/
    .wheel-container {
      overflow: hidden;
      position: relative;
      transition: transform 360ms ease;
      will-change: transform;
      touch-action: pan-y;
    }

    .wheel-track {
      display: block;
      position: relative;
      transform-origin: 50% 50%;
      will-change: transform;
    }
  </style>
</head>

<body>
  <!-- main wrapper for the layout -->
  <section class="wrapper">
    <div id="api-status" style="display:none;
  padding:20px;
  border-radius:8px;
  background:#ffe8e8;
  color:#a40000;
  font-weight:600;
  width: 100%;
  max-width: 400px;
  text-align: center;
  margin: auto;
  position:absolute;
  left: 50%; top: 55%; transform: translate(-50% , -50%);z-index: 999;">
    </div>

    <!-- Loader shown while a card's trailer/details are being fetched -->
    <div id="cardLoader" class="card-loader hidden">
      <div class="spinner"></div>
    </div>

    <header>
      <nav id="navigation">
        <div class="nav-left">
          <a href="https://moviio.vercel.app">
            <div class="logo">
              <span class="logo-dot"></span>
              <span class="logo-dot"></span><span class="logo-dot"></span><span class="logo-dot"></span>
            </div>
          </a>
        </div>
        <div class="search-wrapper">
          <input type="search" placeholder="Search the movies" id="searchBox">
          <button class="search-icon" id="searchBtn">
            <i class="fa-solid fa-search"></i>
          </button>
        </div>
        <button class="shortcuts-btn" id="shortcutsBtn" title="Keyboard Shortcuts">
        <svg style="height: 66%; width:66%; " viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M10 10V7C10 5.34315 8.65685 4 7 4C5.34315 4 4 5.34315 4 7C4 8.65685 5.34315 10 7 10H10ZM10 10V14M10 10H14M10 14V17C10 18.6569 8.65685 20 7 20C5.34315 20 4 18.6569 4 17C4 15.3431 5.34315 14 7 14H10ZM10 14H14M14 10H17C18.6569 10 20 8.65685 20 7C20 5.34315 18.6569 4 17 4C15.3431 4 14 5.34315 14 7V10ZM14 10V14M14 14H17C18.6569 14 20 15.3431 20 17C20 18.6569 18.6569 20 17 20C15.3431 20 14 18.6569 14 17V14Z"
              stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </g>
        </svg>
        </button>

        <div class="shortcuts-dropdown hidden" id="shortcutsDropdown">
          <h4>Keyboard Shortcuts</h4>
          <ul>
            <li><span class="key">←</span> <span class="key">→</span> <span>Navigate cards</span></li>
            <li><span class="key">Enter</span> <span class="key">Space</span> <span>Open active card's trailer</span>
            </li>
            <li><span class="key">Esc</span> <span>Close trailer</span></li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="main-site">
      <!-- hero section -->
      <section class="hero-section">
        <h1>Search and Discover Movies</h1>
        <div class="filter-wrapper">
          <span class="active-indicator"></span>
          <button class="filter-btn active" data-attribute="popular">Popular</button>
          <button class="filter-btn" data-attribute="upcoming">Upcoming</button>
          <button class="filter-btn" data-attribute="top_rated">Top Rated</button>
          <button class="filter-btn" data-attribute="watchlist">Watchlist</button>

          <!-- Genre & Year selectors -->
          <select class="filter-select" id="genreSelect">
            <option value="">All Genres</option>
          </select>
          <select class="filter-select" id="yearSelect">
            <option value="">All Years</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
          </select>
        </div>


      </section>

      <!-- wheel container -->
      <div class="wheel-container">
        <!-- NEW: shown when a filter (currently just Watchlist) returns
             zero items — dims the card wheel via CSS and centers this. -->
        <div id="emptyState" class="empty-state hidden">
          <i class="fa-regular fa-heart"></i>
          <p>Nothing in your watchlist yet.</p>
        </div>

        <!-- LEFT arrow + Auto-Rotate button stacked directly under it -->
        <button class="move-right controller-btn">
          <span>
            <i class="fas fa-angle-right"></i>
          </span>
        </button>
        <button class="move-left controller-btn">
          <span>
            <i class="fas fa-angle-left"></i>
          </span>
        </button>

        <!-- UPDATED: Auto-Rotate now positioned under the left arrow,
             Shuffle now positioned under the right arrow.
             (Previously both lived together in a centered
             ".extras-controls" bar below the whole wheel.) -->
        <button id="autoRotateBtn">
          <strong>
            <i class="fa-solid fa-play"></i>
            <span>Auto Rotate</span>
          </strong>
        </button>

        <button id="shuffleBtn">
          <strong>
            <i class="fa-solid fa-shuffle"></i>
            <span>Shuffle</span>
          </strong>
        </button>

        <!-- cards container with wheel Ui -->
        <div class="wheel-track">
          <!-- 7 static card placeholders -->
          <div class="card card-0">
            <div class="movie-details">
              <div class="details-top">
                <div class="movie-type">
                  <div class="badge-top-left"></div>
                  <div class="badge-top-right"></div>
                </div>
                <div class="movie-rating">
                  <h2><span><i class="fa-solid fa-star"></i></span></h2>
                </div>
              </div>
              <div class="details-bottom">
                <div class="card-content">
                  <h3></h3>
                  <div class="movie-dateType">
                    <span class="movie-data"></span> • <span class="what-type"></span>
                  </div>
                </div>
              </div>
            </div>
            <img src="" alt="">
          </div>
          <div class="card card-1">
            <div class="movie-details">
              <div class="details-top">
                <div class="movie-type">
                  <div class="badge-top-left"></div>
                  <div class="badge-top-right"></div>
                </div>
                <div class="movie-rating">
                  <h2><span><i class="fa-solid fa-star"></i></span></h2>
                </div>
              </div>
              <div class="details-bottom">
                <div class="card-content">
                  <h3></h3>
                  <div class="movie-dateType">
                    <span class="movie-data"></span> • <span class="what-type"></span>
                  </div>
                </div>
              </div>
            </div>
            <img src="" alt="">
          </div>
          <div class="card card-2">
            <div class="movie-details">
              <div class="details-top">
                <div class="movie-type">
                  <div class="badge-top-left"></div>
                  <div class="badge-top-right"></div>
                </div>
                <div class="movie-rating">
                  <h2><span><i class="fa-solid fa-star"></i></span></h2>
                </div>
              </div>
              <div class="details-bottom">
                <div class="card-content">
                  <h3></h3>
                  <div class="movie-dateType">
                    <span class="movie-data"></span> • <span class="what-type"></span>
                  </div>
                </div>
              </div>
            </div>
            <img src="" alt="">
          </div>
          <div class="card card-3" id="active-card">
            <div class="movie-details">
              <div class="details-top">
                <div class="movie-type">
                  <div class="badge-top-left"></div>
                  <div class="badge-top-right"></div>
                </div>
                <div class="movie-rating">
                  <h2><span><i class="fa-solid fa-star"></i></span></h2>
                </div>
              </div>
              <div class="details-bottom">
                <div class="card-content">
                  <h3></h3>
                  <div class="movie-dateType">
                    <span class="movie-data"></span> • <span class="what-type"></span>
                  </div>
                </div>
              </div>
            </div>
            <img src="" alt="">
          </div>
          <div class="card card-4">
            <div class="movie-details">
              <div class="details-top">
                <div class="movie-type">
                  <div class="badge-top-left"></div>
                  <div class="badge-top-right"></div>
                </div>
                <div class="movie-rating">
                  <h2><span><i class="fa-solid fa-star"></i></span></h2>
                </div>
              </div>
              <div class="details-bottom">
                <div class="card-content">
                  <h3></h3>
                  <div class="movie-dateType">
                    <span class="movie-data"></span> • <span class="what-type"></span>
                  </div>
                </div>
              </div>
            </div>
            <img src="" alt="">
          </div>
          <div class="card card-5">
            <div class="movie-details">
              <div class="details-top">
                <div class="movie-type">
                  <div class="badge-top-left"></div>
                  <div class="badge-top-right"></div>
                </div>
                <div class="movie-rating">
                  <h2><span><i class="fa-solid fa-star"></i></span></h2>
                </div>
              </div>
              <div class="details-bottom">
                <div class="card-content">
                  <h3></h3>
                  <div class="movie-dateType">
                    <span class="movie-data"></span> • <span class="what-type"></span>
                  </div>
                </div>
              </div>
            </div>
            <img src="" alt="">
          </div>
          <div class="card card-6">
            <div class="movie-details">
              <div class="details-top">
                <div class="movie-type">
                  <div class="badge-top-left"></div>
                  <div class="badge-top-right"></div>
                </div>
                <div class="movie-rating">
                  <h2><span><i class="fa-solid fa-star"></i></span></h2>
                </div>
              </div>
              <div class="details-bottom">
                <div class="card-content">
                  <h3></h3>
                  <div class="movie-dateType">
                    <span class="movie-data"></span> • <span class="what-type"></span>
                  </div>
                </div>
              </div>
            </div>
            <img src="" alt="">
          </div>
        </div>
      </div>
    </main>
  </section>

  <!-- this is the movie pop with trailer  -->
  <div id="trailer-overlay" class="hidden">
    <div class="trailer-bg">
      <iframe id="trailerPlayer" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen></iframe>
    </div>
    <div class="trailer-gradient"></div>
    <div class="trailer-content">
      <div class="movie-rating">
        <span class="tag rating" id="trailerRating"></span>
        <i class="fa-solid fa-star" id="fa-star"></i>
      </div>
      <h1 id="trailerTitle"></h1>
      <div class="meta">
        <span><i class="fa-solid fa-play"></i> <span>Movie</span></span>
        <span><i class="fa-solid fa-calendar-days"></i> <span id="trailerYear"></span></span>
      </div>
      <p id="trailerOverview" class="overview"></p>

      <!-- Trailer Controls (Play/Pause, Fullscreen, Watchlist, Share) -->
      <div class="trailer-controls">
        <button class="btn primary" id="playPauseBtn">
          <i class="fa-solid fa-play"></i> Watch Now
        </button>
        <button class="btn-icon" id="fullscreenBtn" title="Fullscreen">
          <i class="fa-solid fa-expand"></i>
        </button>
        <button class="btn-icon watchlist-btn" id="overlayWatchlistBtn" title="Add to Watchlist">
          <i class="fa-regular fa-heart"></i>
        </button>
        <button class="btn-icon" id="shareBtn" title="Share Movie">
          <i class="fa-solid fa-share-nodes"></i>
        </button>
      </div>
    </div>

    <button id="closeTrailer" class="close">
      <svg xmlns="http://www.w3.org/2000/svg" width="4em" height="4em" fill="currentColor" viewBox="0 0 256 256">
        <path
          d="M232,200a8,8,0,0,1-16,0,88.1,88.1,0,0,0-88-88H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,85.66,61.66L51.31,96H128A104.11,104.11,0,0,1,232,200Z">
        </path>
      </svg>
    </button>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>

</html>
