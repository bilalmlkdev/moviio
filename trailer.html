<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Moviio - Trailer</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /*  CSS VARIABLES  */
    :root {
      --card-w: 270px;
      --card-h: 380px;
      --wheel-height: 700px;
      --transition-duration: 360ms;
      --bg-color: #000000;
      --txt-color: #ffffff;
      --txt-muted: #a3a3a3;
      --card-color: #111111;
      --border-color: #333333;
      --primary-color: #ffffff;
      --primary-fg: #000000;
      --chip-bg: rgba(255, 255, 255, 0.08);
      --chip-border: rgba(255, 255, 255, 0.2);
      --accent-color: var(--primary-color);
      --surface-color: rgba(255, 255, 255, 0.06);
      --surface-border: rgba(255, 255, 255, 0.12);
      --surface-hover: rgba(255, 255, 255, 0.12);
      --shadow-strong: 0 20px 50px rgba(0, 0, 0, 0.5);
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
      --font-sans: "Outfit", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
      --font-serif: "Instrument Serif", Georgia, serif;
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --txt-color: #000000;
      --txt-muted: #666666;
      --card-color: #ffffff;
      --border-color: #cccccc;
      --primary-color: #000000;
      --primary-fg: #ffffff;
      --chip-bg: rgba(0, 0, 0, 0.06);
      --chip-border: rgba(0, 0, 0, 0.2);
      --surface-color: rgba(0, 0, 0, 0.04);
      --surface-border: rgba(0, 0, 0, 0.1);
      --surface-hover: rgba(0, 0, 0, 0.07);
      --shadow-strong: 0 20px 50px rgba(0, 0, 0, 0.15);
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    /*  ISOLATED TRAILER PAGE STYLES  */
    /* All styles scoped under .trailer-page to prevent conflicts */

    .trailer-page {
      position: fixed;
      inset: 0;
      background: #0a0a0a !important;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      z-index: 9999;
      width: 100%;
      height: 100vh;
      font-family: var(--font-sans);
      color: #ffffff;
      margin: 0;
      padding: 0;
    }

    .trailer-page * {
      box-sizing: border-box;
    }

    .trailer-page.trailer-page {
      position: relative;
      inset: auto;
      width: 100%;
      height: 100vh;
      z-index: auto;
      padding-left: 50px;
    }

    .trailer-page .back-btn {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
      padding: 0;
      margin: 0;
    }

    .trailer-page .back-btn:hover {
      background: rgba(0, 0, 0, 0.75);
    }

    .trailer-page .trailer-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .trailer-page #trailerPlayer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1920px;
      height: 1080px;
      transform: translate(-50%, -50%);
      border: none;
    }

    .trailer-page .trailer-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #000 25%, rgba(0, 0, 0, 0.5) 60%, rgba(0, 0, 0, 0.9));
    }

    .trailer-page .trailer-content {
      position: relative;
      z-index: 5;
      width: 50%;
      max-width: 800px;
      margin-left: 4rem;
      color: #f2ece4 !important;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      margin: 0;
      padding: 0;
    }

    .trailer-page .trailer-content .movie-rating {
      margin: 0;
      padding: 0;
    }

    .trailer-page .trailer-content .movie-rating span {
      font-size: 25px;
      color: #f2ece4 !important;
      margin: 0;
      padding: 0;
    }

    .trailer-page .trailer-content h1 {
      font-size: 4rem;
      line-height: 1.1;
      color: #fff !important;
      margin: 0;
      padding: 0;
    }

    .trailer-page .trailer-content .meta {
      margin: 0;
      padding: 0;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .trailer-page .trailer-content .meta span {
      color: #ccc !important;
      margin: 0;
      padding: 0;
      font-size: 14px;
    }

    .trailer-page .trailer-content .overview {
      color: #ddd !important;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .trailer-page .trailer-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 20px 0 0 0;
      padding: 0;
    }

    .trailer-page .btn {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      background: transparent;
      color: inherit;
    }

    .trailer-page .btn.primary {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .trailer-page .btn.primary:hover {
      background: #f0f0f0;
      border-color: #f0f0f0;
    }

    .trailer-page .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      padding: 0;
      margin: 0;
      font-size: 16px;
    }

    .trailer-page .btn-icon:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Watch Now Modal - scoped */
    .trailer-page .watchnow-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10002;
    }

    .trailer-page .watchnow-modal.hidden {
      display: none;
    }

    .trailer-page .watchnow-content {
      background: #111111;
      border: 1px solid #333333;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      margin: 0;
    }

    .trailer-page .watchnow-content h2 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      margin: 0 0 20px 0;
      color: #ffffff;
      padding: 0;
    }

    .trailer-page .platform-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 0;
      padding: 0;
    }

    .trailer-page .platform-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #333333;
      color: #ffffff;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
      cursor: pointer;
      margin: 0;
      font-size: 14px;
    }

    .trailer-page .platform-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.02);
    }

    .trailer-page .platform-btn i {
      font-size: 1.2rem;
      width: 24px;
      color: #ffffff;
    }

    .trailer-page .watchnow-close {
      margin: 20px 0 0 0;
      background: none;
      border: none;
      color: #a3a3a3;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0;
    }

    /* Loader - scoped */
    .trailer-page #cardLoader {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.3s;
    }

    .trailer-page #cardLoader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .trailer-page #cardLoader .spinner {
      width: 56px;
      height: 56px;
      border: 5px solid #333333;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: trailer-spin 0.8s linear infinite;
    }

    .trailer-page #cardLoader .loader-text {
      color: #fff;
      font-family: var(--font-sans);
      margin-top: 20px;
      font-size: 1.2rem;
      padding: 0;
    }

    @keyframes trailer-spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* API Status - scoped */
    .trailer-page #api-status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      padding: 12px 24px;
      border-radius: 10px;
      background: #111111;
      border: 1px solid #333333;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-family: var(--font-sans);
      font-weight: 500;
      max-width: 90%;
      text-align: center;
      transition: opacity 0.3s;
      margin: 0;
    }

    .trailer-page #api-status.hidden {
      display: none;
    }

    .trailer-page .hidden {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .trailer-page .trailer-content {
        width: 80%;
        margin-left: 2rem;
      }

      .trailer-page .trailer-content h1 {
        font-size: 2.5rem;
      }

      .trailer-page .platform-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    (function () {
      try {
        var t = localStorage.getItem("moviio-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <!-- Trailer page -->
  <div id="trailer-overlay" class="trailer-page">
    <button id="backToApp" class="back-btn" title="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="trailer-bg">
      <iframe id="trailerPlayer" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen></iframe>
    </div>
    <div class="trailer-gradient"></div>
    <div class="trailer-content">
      <div class="movie-rating">
        <span class="tag rating" id="trailerRating"></span>
        <i class="fa-solid fa-star" id="fa-star"></i>
      </div>
      <h1 id="trailerTitle"></h1>
      <div class="meta">
        <span><i class="fa-solid fa-play"></i> <span>Movie</span></span>
        <span><i class="fa-solid fa-calendar-days"></i> <span id="trailerYear"></span></span>
      </div>
      <p id="trailerOverview" class="overview"></p>

      <div class="trailer-controls">
        <button class="btn primary" id="playPauseBtn">
          <i class="fa-solid fa-play"></i> Watch Now
        </button>
        <button class="btn-icon" id="fullscreenBtn" title="Fullscreen">
          <i class="fa-solid fa-expand"></i>
        </button>
        <button class="btn-icon" id="overlayFavouriteBtn" title="Add to Favourites">
          <i class="fa-regular fa-heart"></i>
        </button>
        <button class="btn-icon" id="shareBtn" title="Share Movie">
          <i class="fa-solid fa-share-nodes"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Full-screen loader while trailer data loads -->
  <div id="cardLoader" class="hidden">
    <div class="spinner"></div>
    <div class="loader-text">Loading trailer…</div>
  </div>

  <div id="api-status"></div>

  <script src="theme.js"></script>
  <script type="module" src="scripts/trailer-page.js"></script>
</body>

</html>
