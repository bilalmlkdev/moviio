<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!--  SEO -->
  <title>Moviio - Discover movies in motion. Browse films, watch trailers, and explore cinema with Moviio.</title>
  <meta name="description"
    content="Moviio is a modern movie discovery platform to explore popular, top-rated, and upcoming films, watch official trailers, and browse cinema in a smooth motion-driven experience." />
  <meta name="keywords"
    content="movies, movie discovery, film explorer, cinema, movie trailers, tmdb, film search, moviio" />
  <meta name="author" content="Moviio" />
  <meta name="robots" content="index, follow" />
  <meta property="og:description"
    content="Discover movies in motion. Browse films, watch trailers, and explore cinema with Moviio." />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="./assets/favicon.svg" />
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("moviio-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* this is for layout safety of cards*/
    .wheel-container {
      overflow: hidden;
      position: relative;
      transition: transform 360ms ease;
      will-change: transform;
      touch-action: pan-y;
    }

    .wheel-track {
      display: block;
      position: relative;
      transform-origin: 50% 50%;
      will-change: transform;
    }
  </style>
</head>

            <button class="filter-btn" data-attribute="top_rated">Top Rated</button>
            <button class="filter-btn" data-attribute="watchlist">Watchlist</button>
          </div>

          <!-- Genre & Year: custom dropdowns, backed by real <select> for existing script.js logic -->
          <div class="custom-dropdown" id="genreDropdown">

            </button>
            <div class="dropdown-menu" role="listbox"></div>
            <select class="filter-select sr-only" id="genreSelect" tabindex="-1" aria-hidden="true">

            </select>
          </div>

          <div class="custom-dropdown" id="yearDropdown">
            <button type="button" class="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="dropdown-value">All Years</span>

            </button>
            <div class="dropdown-menu" role="listbox"></div>
            <select class="filter-select sr-only" id="yearSelect" tabindex="-1" aria-hidden="true">

              <option value="2025">2025</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
              <option value="2022">2022</option>
              <option value="2021">2021</option>
              <option value="2020">2020</option>
              <option value="2019">2019</option>

        </div>

  <!-- this is the movie pop with trailer  -->
  <div id="trailer-overlay" class="hidden">
    <div class="trailer-bg">
      <iframe id="trailerPlayer" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen></iframe>
    </div>
    <div class="trailer-gradient"></div>
    <div class="trailer-content">
      <div class="movie-rating">
        <span class="tag rating" id="trailerRating"></span>
        <i class="fa-solid fa-star" id="fa-star"></i>
      </div>
      <h1 id="trailerTitle"></h1>
      <div class="meta">
        <span><i class="fa-solid fa-play"></i> <span>Movie</span></span>
        <span><i class="fa-solid fa-calendar-days"></i> <span id="trailerYear"></span></span>
      </div>
      <p id="trailerOverview" class="overview"></p>

      <!-- Trailer Controls (Play/Pause, Fullscreen, Watchlist, Share) -->
      <div class="trailer-controls">
        <button class="btn primary" id="playPauseBtn">
          <i class="fa-solid fa-play"></i> Watch Now
        </button>
        <button class="btn-icon" id="fullscreenBtn" title="Fullscreen">
          <i class="fa-solid fa-expand"></i>
        </button>
        <button class="btn-icon watchlist-btn" id="overlayWatchlistBtn" title="Add to Watchlist">
          <i class="fa-regular fa-heart"></i>
        </button>
        <button class="btn-icon" id="shareBtn" title="Share Movie">
          <i class="fa-solid fa-share-nodes"></i>
        </button>
      </div>
    </div>
